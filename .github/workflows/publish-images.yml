name: Publish release plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: grafana-plugin/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: grafana-plugin/go.mod
          cache: true
          cache-dependency-path: grafana-plugin/go.sum

      - name: Install Mage
        run: |
          go install github.com/magefile/mage@v1.17.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Grafana plugin
        working-directory: grafana-plugin
        run: |
          mage -v
          npm ci
          npm run build

      - name: Package and upload plugin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          archive="harv-logs-${RELEASE_TAG#v}.tar.gz"
          tar -czf "$archive" -C "$GITHUB_WORKSPACE/grafana-plugin" dist
          gh release upload "$RELEASE_TAG" "$archive" --repo "$GITHUB_REPOSITORY" --clobber