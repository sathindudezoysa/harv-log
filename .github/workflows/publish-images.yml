name: Publish release images

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  GRAFANA_IMAGE: grafana:13.1.0
  LOKI_IMAGE: grafana/loki:3.5.0
  PROMTAIL_IMAGE: grafana/promtail:3.5.0

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release image tags
        id: tags
        shell: bash
        run: |
          release_tag="${{ github.event.release.tag_name }}"
          echo "release_tag=${release_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Package and upload release bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          archive="harv-logs-${RELEASE_TAG#v}.tar.gz"
          tar -czf "$archive" -C release docker-compose.yaml Makefile scripts
          gh release upload "$RELEASE_TAG" "$archive" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Build and publish Grafana image
        uses: docker/build-push-action@v6
        with:
          context: ./grafana-plugin
          file: ./grafana-plugin/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            grafana_image=grafana
            grafana_version=13.1.0
          push: true
          cache-from: type=gha,scope=grafana
          cache-to: type=gha,mode=max,scope=grafana
          tags: |
            ${{ env.IMAGE_PREFIX }}-grafana:${{ steps.tags.outputs.release_tag }}
            ${{ env.IMAGE_PREFIX }}-grafana:latest

      - name: Build and publish Loki image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./release/Dockerfile.loki
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=loki
          cache-to: type=gha,mode=max,scope=loki
          tags: |
            ${{ env.IMAGE_PREFIX }}-loki:${{ steps.tags.outputs.release_tag }}
            ${{ env.IMAGE_PREFIX }}-loki:latest

      - name: Build and publish Promtail image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./release/Dockerfile.promtail
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=promtail
          cache-to: type=gha,mode=max,scope=promtail
          tags: |
            ${{ env.IMAGE_PREFIX }}-promtail:${{ steps.tags.outputs.release_tag }}
            ${{ env.IMAGE_PREFIX }}-promtail:latest