name: Publish release images

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  GRAFANA_IMAGE: grafana:13.1.0
  LOKI_IMAGE: grafana/loki:3.5.0
  PROMTAIL_IMAGE: grafana/promtail:3.5.0

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_PREFIX: ghcr.io/${{ github.repository }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release image tags
        id: tags
        shell: bash
        run: |
          release_tag="${{ github.event.release.tag_name }}"
          echo "release_tag=${release_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build and publish Grafana image
        uses: docker/build-push-action@v6
        with:
          context: ./grafana-plugin
          file: ./grafana-plugin/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            grafana_image=grafana
            grafana_version=13.1.0
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-grafana:${{ steps.tags.outputs.release_tag }}
            ${{ env.IMAGE_PREFIX }}-grafana:latest

      - name: Publish Loki image to GHCR
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_PREFIX}-loki:${{ steps.tags.outputs.release_tag }}" \
            --tag "${IMAGE_PREFIX}-loki:latest" \
            "$LOKI_IMAGE"

      - name: Publish Promtail image to GHCR
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_PREFIX}-promtail:${{ steps.tags.outputs.release_tag }}" \
            --tag "${IMAGE_PREFIX}-promtail:latest" \
            "$PROMTAIL_IMAGE"