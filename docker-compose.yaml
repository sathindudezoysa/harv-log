services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    volumes:
      - ./dist:/var/lib/grafana/plugins/wso2-rca-app
      - ./rules/rca-rules.yaml:/var/lib/grafana/plugins/wso2-rca-app/rules/rca-rules.yaml:ro
      - ./provisioning:/etc/grafana/provisioning
      - .:/root/wso2-rca-app
    environment:
      RCA_RULES_PATH: /var/lib/grafana/plugins/wso2-rca-app/rules/rca-rules.yaml
