services:
  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ../configs/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3100/ready | grep -q Ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    ports:
      - "9080:9080"
    volumes:
      - ../configs/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - ./bundle-logs:/var/log/bundle/bundle-logs:ro
      - promtail-positions:/tmp
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9080/ready | grep -q ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: harv-logs
      GF_INSTALL_PLUGINS: grafana-llm-app
    restart: unless-stopped
    volumes:
      - ../configs/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./dist:/var/lib/grafana/plugins/harv-logs
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health | grep -q 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  loki-data:
  promtail-positions:
  grafana-data:
